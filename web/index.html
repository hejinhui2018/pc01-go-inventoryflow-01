<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InventoryFlow 库存台账</title><style>body{font:16px system-ui;margin:2rem;color:#203040}main{max-width:960px;margin:auto}header{display:flex;justify-content:space-between}table{width:100%;border-collapse:collapse;margin-top:1rem}th,td{padding:.6rem;border-bottom:1px solid #ccd5dd;text-align:left}.ok{color:#177245}</style></head><body data-build="dev"><main><header><h1>InventoryFlow 库存台账</h1><span id="health">检查中...</span></header><p>仓库库存、预留与对账汇总</p><table><thead><tr><th>SKU</th><th>仓库</th><th>在库</th><th>预留</th><th>可用</th></tr></thead><tbody id="rows"><tr><td colspan="5">等待数据</td></tr></tbody></table></main><script>Promise.all([fetch('/health').then(r=>r.json()),fetch('/v1/report').then(r=>r.json())]).then(([h,d])=>{document.querySelector('#health').textContent=h.ready?'服务正常':'服务异常';document.querySelector('#health').className='ok';document.querySelector('#rows').innerHTML=(d.rows||[]).map(x=>`<tr><td>${x.sku}</td><td>${x.warehouse}</td><td>${x.on_hand}</td><td>${x.reserved}</td><td>${x.available}</td></tr>`).join('')||'<tr><td colspan="5">暂无库存</td></tr>'}).catch(()=>document.querySelector('#health').textContent='服务不可用');</script></body></html>
